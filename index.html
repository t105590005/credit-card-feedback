<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>信用卡回饋助手</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5f27cd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #f8f9ff; --card-bg: #ffffff;
            --primary: #5f27cd; --primary-light: #9980FA;
            --success: #1dd1a1; --warning: #ff9f43; --danger: #ee5253;
            --text-dark: #341f97; --text-card: #5f27cd;
            --note-bg: #f3f0ff; --note-text: #5f27cd;
            --limit-bg: #e6fffa; --limit-text: #00b894;
            --coin-gold: #FFD166; --coin-border: #341f97;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Quicksand','Hiragino Maru Gothic ProN', 'M PLUS Rounded 1c', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg); color: var(--text-dark);
            margin: 0; padding: 12px;
            line-height: 1.5; letter-spacing: 0.02em;
            overflow-x: hidden;
        }

        .container { max-width: 480px; margin: 0 auto; padding-bottom: 120px; }

        .icon-svg {
            width: 1.1em; height: 1.1em;
            display: inline-block; vertical-align: middle;
            stroke-width: 2.5; stroke: currentColor; fill: none;
            stroke-linecap: round; stroke-linejoin: round;
            margin-right: 4px; position: relative; top: -1px;
        }

        .dashboard {
            background: linear-gradient(135deg, #5f27cd 0%, #341f97 100%);
            border-radius: 35px; padding: 25px; color: white;
            box-shadow: 0 15px 35px rgba(95, 39, 205, 0.25);
            margin-bottom: 25px; display: flex; justify-content: space-around;
        }
        .stat-value { font-size: 1.7em; font-weight: 800; }

        .category-card {
            background: var(--card-bg); border-radius: 35px; margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid rgba(95, 39, 205, 0.05);
            overflow: hidden;
        }
        .category-head { padding: 20px 25px; display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; }
        .category-info-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
        .category-name { font-weight: 800; font-size: 1.25em; color: var(--text-dark); display: flex; align-items: center; }
        
        .subtotal-badge { 
            font-size: 0.75em; color: var(--primary); background: var(--note-bg); 
            padding: 5px 15px; border-radius: 50px; font-weight: 800; 
            border: 1px solid #e0d9ff; width: fit-content; white-space: nowrap;
        }

        .btn-small-add {
            background: none; border: 1.5px solid #e0e6ed; color: #94a3b8;
            padding: 5px 12px; border-radius: 15px; font-size: 0.75em; font-weight: 700;
            margin-top: 5px; display: flex; align-items: center;
        }

        .card-list { display: block; overflow: hidden; }
        .card-list.collapsed { display: none; }
        .card-item { padding: 25px; border-top: 1px solid #f8f9ff; }

        .card-header-row { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .card-info-area { flex: 1; min-width: 0; }
        .card-title { font-weight: 800; font-size: 1.25em; color: var(--text-card); margin-bottom: 8px; cursor: pointer; word-break: break-all; }
        
        .label-group { display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .pill { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 50px; font-size: 0.8em; font-weight: 800; width: fit-content; white-space: nowrap; }
        .pill-note { background: var(--note-bg); color: var(--note-text); border: 1.5px solid #e0d9ff; cursor: pointer; }
        .pill-limit { background: var(--limit-bg); color: var(--limit-text); border: 1.5px solid #c6f6d5; }

        .btn-record { 
            background: var(--coin-gold); color: var(--coin-border); border: 3px solid var(--coin-border);
            width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 4px 4px 0px var(--coin-border); cursor: pointer; transition: 0.1s; flex-shrink: 0; user-select: none;
        }
        .btn-record svg { width: 1.6em; height: 1.6em; stroke-width: 3; margin: 0; top: 0; }
        .btn-record:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--coin-border); }

        .progress-box { background: #f1f5f9; height: 14px; border-radius: 50px; margin: 15px 0; cursor: pointer; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 50px; transition: width 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .bg-green { background: linear-gradient(90deg, #1dd1a1, #00d2d3); }
        .bg-orange { background: linear-gradient(90deg, #ff9f43, #ff6b6b); }
        .bg-red { background: linear-gradient(90deg, #ee5253, #ff4757); }

        .card-footer { display: flex; justify-content: space-between; font-size: 0.82em; color: #94a3b8; font-weight: 600; margin-top: 5px; flex-wrap: wrap; gap: 5px; }
        .clickable { color: var(--primary-light); text-decoration: underline; cursor: pointer; }

        .admin-tools { display: flex; gap: 12px; margin-top: 30px; }
        .btn-tool { flex: 1; padding: 16px; border-radius: 20px; border: 1.5px solid #e2e8f0; background: white; font-weight: 800; color: #64748b; cursor: pointer; font-size: 0.85em; text-align: center; display: flex; justify-content: center; align-items: center; }

        #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(52, 31, 151, 0.5); backdrop-filter: blur(5px); z-index: 999; align-items: center; justify-content: center; }
        .modal-body { background: white; width: 90%; max-width: 420px; padding: 30px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: popIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); max-height: 90vh; overflow-y: auto; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .input-box { width: 100%; padding: 16px; border: 2.5px solid #f1f5f9; border-radius: 20px; font-size: 16px; box-sizing: border-box; background: #f8fafc; outline: none; margin: 10px 0; font-family: inherit; }
        .input-box:focus { border-color: var(--primary-light); }
        .modal-btns { display: flex; gap: 15px; margin-top: 25px; }
        .btn-modal-confirm { flex: 2; padding: 18px; border-radius: 20px; border: none; background: var(--primary); color: white; font-weight: 800; cursor: pointer; font-family: inherit; }
        .btn-modal-cancel { flex: 1; padding: 18px; border-radius: 20px; border: none; background: #f1f5f9; color: #94a3b8; font-weight: 800; cursor: pointer; }
        
        .guide-text { font-size: 0.85em; color: #8395a7; margin-bottom: 10px; display: block; font-weight: 500; }
        .guide-accent { color: var(--primary); font-weight: 800; }
        h3 { display: flex; align-items: center; margin-top: 0; }
        
        /* 明細列表樣式 */
        .history-list { margin-top: 15px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1.5px dashed #f1f5f9; }
        .history-date { font-size: 0.8em; color: #94a3b8; font-weight: 700; }
        .history-amount { font-weight: 800; color: var(--text-dark); font-size: 1.1em; }
        .history-del { background: #ffeaa7; color: #d63031; border: none; border-radius: 10px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 800; }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard">
        <div style="text-align: center;">
            <span style="font-size: 0.8em; opacity: 0.8; display: block; margin-bottom: 5px; font-weight: 700;">本月總支出</span>
            <div class="stat-value" id="globalTotalSpent">$0</div>
        </div>
        <div style="text-align: center;">
            <span style="font-size: 0.8em; opacity: 0.8; display: block; margin-bottom: 5px; font-weight: 700;">預計回饋</span>
            <div class="stat-value" style="color: #ffd166" id="globalTotalReward">$0</div>
        </div>
    </div>

    <button onclick="showAddCat()" style="width: 100%; padding: 22px; border-radius: 25px; border: none; background: white; color: var(--primary); font-weight: 800; font-size: 1.05em; box-shadow: 0 12px 25px rgba(0,0,0,0.05); margin-bottom: 25px; cursor: pointer; font-family: inherit; display:flex; align-items:center; justify-content:center;">
        <svg class="icon-svg" viewBox="0 0 24 24" style="margin-right:8px"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
        新增消費分類頻道
    </button>

    <div id="mainDisplay"></div>

    <div class="admin-tools">
        <button class="btn-tool" onclick="exportData()"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> 備份</button>
        <button class="btn-tool" onclick="document.getElementById('fileInput').click()"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> 匯入</button>
        <button class="btn-tool" style="color: var(--danger); border-color: #ffccd5;" onclick="resetAll()"><svg class="icon-svg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> 歸零</button>
        <input type="file" id="fileInput" style="display:none" onchange="importData(event)" accept=".json">
    </div>
</div>

<div id="modalOverlay" onclick="if(event.target==this)closeModal()"><div class="modal-body" id="modalBox"></div></div>

<script>
    const STORAGE_KEY = 'cardTracker_Ledger_v1';
    let data = [];

    const ICONS = {
        edit: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>',
        money: '<svg class="icon-svg" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>',
        card: '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>',
        settings: '<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>',
        plus: '<svg class="icon-svg" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
        chart: '<svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>',
        history: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>'
    };

    function load() {
        try {
            let saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            data = migrate(saved);
            render();
        } catch(e) { data = []; render(); }
    }

    // --- 資料結構遷移：加入 records 明細陣列 ---
    function migrate(list) {
        return list.map(cat => ({
            ...cat,
            cards: cat.cards.map(card => {
                let newCard = { ...card };
                if (!newCard.tiers) newCard.tiers = [{ rate: newCard.rate || 0, limit: newCard.limit || 0 }];
                // 若沒有紀錄陣列，則初始化，並將舊有的 spent 金額轉換為一筆「前期累積」紀錄
                if (!newCard.records) {
                    newCard.records = [];
                    if (newCard.spent > 0) {
                        newCard.records.push({
                            id: Date.now() + Math.random(),
                            amount: newCard.spent,
                            date: '前期累積紀錄'
                        });
                    }
                }
                return newCard;
            })
        }));
    }

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); render(); }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

    function toggleCategory(id) {
        const cat = data.find(c => c.id === id);
        if (cat) { cat.isCollapsed = !cat.isCollapsed; save(); }
    }

    function render() {
        const container = document.getElementById('mainDisplay');
        container.innerHTML = '';
        let gSpent = {};
        
        data.forEach(cat => cat.cards.forEach(card => {
            const n = card.name.trim();
            gSpent[n] = (gSpent[n] || 0) + (card.spent || 0);
        }));

        data.forEach(cat => {
            let catHtml = "", catTotal = 0;
            cat.cards.forEach(card => {
                const totalS = gSpent[card.name.trim()];
                catTotal += (card.spent || 0);
                
                let minCap = 9999999;
                card.tiers.forEach(t => { 
                    if (t.limit < 999999) { 
                        const cap = Math.round(t.limit / (t.rate / 100)); 
                        if (cap < minCap) minCap = cap; 
                    } 
                });
                
                const pct = Math.min((totalS / minCap) * 100, 100);
                const rem = Math.max(0, minCap - totalS);
                let col = "bg-green"; if(pct>=100) col="bg-red"; else if(pct>=80) col="bg-orange";

                catHtml += `
                <div class="card-item">
                    <div class="card-header-row">
                        <div class="card-info-area" onclick="showEdit(${cat.id}, ${card.id}, 'name')">
                            <div class="card-title">${card.name}</div>
                            <div class="label-group">
                                <div class="pill pill-note" onclick="event.stopPropagation(); showEdit(${cat.id}, ${card.id}, 'note')">
                                    ${ICONS.edit} ${card.note || '備註'}
                                </div>
                                <div class="pill pill-limit">
                                    ${ICONS.money} 剩 $${rem.toLocaleString()}
                                </div>
                            </div>
                        </div>
                        <button class="btn-record" onclick="showRecord(${cat.id}, ${card.id})">${ICONS.money}</button>
                    </div>
                    <div class="progress-box" onclick="showRewardDetail('${card.name}')">
                        <div class="progress-fill ${col}" style="width: ${pct}%"></div>
                    </div>
                    <div class="card-footer">
                        <span>總刷: <b>$${totalS.toLocaleString()}</b> (<span class="clickable" onclick="showHistory(${cat.id}, ${card.id})">📜 明細 $${(card.spent||0).toLocaleString()}</span>)</span>
                        <span class="clickable" onclick="showEdit(${cat.id}, ${card.id}, 'tiers')">${card.tiers.length}層規則 ${ICONS.settings}</span>
                    </div>
                    <div style="text-align:right; margin-top:10px;"><button style="background:none;border:none;color:#cbd5e1;font-size:0.75em;cursor:pointer;" onclick="if(confirm('確定刪除？')){data.find(c=>c.id===${cat.id}).cards=data.find(c=>c.id===${cat.id}).cards.filter(cd=>cd.id!==${card.id});save();}">✕ 刪除項目</button></div>
                </div>`;
            });

            container.innerHTML += `
            <div class="category-card">
                <div class="category-head" onclick="toggleCategory(${cat.id})">
                    <div class="category-info-wrap">
                        <div class="category-name"><span>${cat.isCollapsed ? '▶' : '▼'}</span> ${cat.name}</div>
                        <div class="subtotal-badge">小計：$${catTotal.toLocaleString()}</div>
                    </div>
                    <button class="btn-small-add" onclick="event.stopPropagation(); showAddCard(${cat.id})">${ICONS.plus} 卡片</button>
                </div>
                <div class="card-list ${cat.isCollapsed ? 'collapsed' : ''}">${catHtml || '<div style="padding:30px;text-align:center;color:#cbd5e1;font-size:0.9em;">點擊「＋卡片」開始紀錄</div>'}</div>
            </div>`;
        });

        let totalS = 0, totalR = 0, done = {};
        data.forEach(cat => cat.cards.forEach(card => {
            totalS += (card.spent || 0);
            const n = card.name.trim();
            if (!done[n]) { 
                card.tiers.forEach(t => { 
                    totalR += Math.floor(Math.min(gSpent[n] * (t.rate / 100), t.limit)); 
                }); 
                done[n] = true; 
            }
        }));
        document.getElementById('globalTotalSpent').innerText = '$' + totalS.toLocaleString();
        document.getElementById('globalTotalReward').innerText = '$' + Math.floor(totalR).toLocaleString();
    }

    async function exportData() {
        const now = new Date();
        const timestamp = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0') + '_' + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');
        const fileName = `信用卡助手備份_${timestamp}.json`;
        const jsonString = JSON.stringify(data, null, 2);

        try {
            if (window.showSaveFilePicker) {
                const handle = await window.showSaveFilePicker({ suggestedName: fileName, types: [{ description: 'JSON Backup', accept: { 'application/json': ['.json'] } }] });
                const writable = await handle.createWritable(); await writable.write(jsonString); await writable.close();
                alert("備份成功！");
            } else { throw new Error("Fallback"); }
        } catch (err) {
            const blob = new Blob([jsonString], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }
    }

    // --- 新增消費，推入 records 陣列 ---
    function showRecord(catId, cardId) {
        const card = data.find(c=>c.id===catId).cards.find(cd=>cd.id===cardId);
        document.getElementById('modalBox').innerHTML = `
            <h3>${ICONS.money} 紀錄消費 (${card.name})</h3>
            <span class="guide-text">💡 紀錄將同步更新至明細表。</span>
            <input type="number" inputmode="decimal" id="sAmt" class="input-box" placeholder="請輸入金額">
            <div class="modal-btns">
                <button class="btn-modal-cancel" onclick="closeModal()">取消</button>
                <button class="btn-modal-confirm" onclick="
                    const a=Number(document.getElementById('sAmt').value); 
                    if(a){
                        const targetCard = data.find(c=>c.id===${catId}).cards.find(cd=>cd.id===${cardId});
                        targetCard.spent += a;
                        
                        // 取得當前時間格式化
                        const now = new Date();
                        const timeString = (now.getMonth() + 1) + '/' + now.getDate() + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
                        
                        // 將紀錄推入陣列開頭 (最新在最上面)
                        if(!targetCard.records) targetCard.records = [];
                        targetCard.records.unshift({ id: Date.now(), amount: a, date: timeString });
                        
                        save(); closeModal();
                    }
                ">確認紀錄</button>
            </div>`;
        document.getElementById('modalOverlay').style.display='flex';
        setTimeout(()=>document.getElementById('sAmt').focus(),100);
    }

    // --- 顯示帳本明細 ---
    function showHistory(catId, cardId) {
        const card = data.find(c=>c.id===catId).cards.find(cd=>cd.id===cardId);
        let listHtml = '';
        
        if (!card.records || card.records.length === 0) {
            listHtml = '<div style="text-align:center; padding:30px; color:#cbd5e1; font-weight:700;">尚無消費紀錄</div>';
        } else {
            card.records.forEach(r => {
                listHtml += `
                <div class="history-item">
                    <div class="history-date">${r.date}</div>
                    <div class="history-amount">$${r.amount.toLocaleString()}</div>
                    <button class="history-del" onclick="deleteRecord(${catId}, ${cardId}, ${r.id})">✕</button>
                </div>`;
            });
        }

        document.getElementById('modalBox').innerHTML = `
            <h3>${ICONS.history} 消費明細 (${card.name})</h3>
            <span class="guide-text">💡 刪除單筆紀錄會自動重算總額。</span>
            <div class="history-list">
                ${listHtml}
            </div>
            <button class="btn-modal-cancel" style="width:100%; margin-top:20px;" onclick="closeModal()">關閉明細</button>
        `;
        document.getElementById('modalOverlay').style.display='flex';
    }

    // --- 刪除單筆紀錄 ---
    function deleteRecord(catId, cardId, recordId) {
        if(!confirm('確定要刪除這筆消費嗎？總金額將重新計算。')) return;
        
        const card = data.find(c=>c.id===catId).cards.find(cd=>cd.id===cardId);
        const recIndex = card.records.findIndex(r => r.id === recordId);
        
        if (recIndex > -1) {
            // 扣除金額
            card.spent -= card.records[recIndex].amount;
            if (card.spent < 0) card.spent = 0; // 防呆
            // 移除陣列項目
            card.records.splice(recIndex, 1);
            save();
            showHistory(catId, cardId); // 重新渲染明細視窗
        }
    }

    function showEdit(catId, cardId, field) {
        const card = data.find(c=>c.id===catId).cards.find(cd=>cd.id===cardId);
        const labels = {'name': `${ICONS.edit} 修改名稱`, 'note': `${ICONS.edit} 修改備註`, 'tiers': `${ICONS.settings} 修改規則`};
        let scopeHint = (field === 'name' || field === 'tiers') ? '💡 注意：修改此項將<span class="guide-accent">同步至所有通路</span>的同名卡片。' : '💡 提示：此項修改<span class="guide-accent">僅影響目前的通路</span>。';

        if (field === 'tiers') {
            document.getElementById('modalBox').innerHTML = `<h3>${labels[field]}</h3><span class="guide-text">${scopeHint}</span><div id="tCon"></div><button onclick="addTierUI()" style="width:100%;padding:10px;margin-bottom:10px;border:2px dashed #ccc;border-radius:18px;background:none;font-weight:800;font-family:inherit;">＋增加分層</button><div class="modal-btns"><button class="btn-modal-cancel" onclick="closeModal()">取消</button><button class="btn-modal-confirm" onclick="doSyncTiers(${catId}, ${cardId})">同步修改</button></div>`;
            card.tiers.forEach(t => addTierUI(t.rate, t.limit));
        } else {
            document.getElementById('modalBox').innerHTML = `<h3>${labels[field]}</h3><span class="guide-text">${scopeHint}</span><input type="text" id="editV" class="input-box" value="${card[field]||''}"> <div class="modal-btns"><button class="btn-modal-cancel" onclick="closeModal()">取消</button><button class="btn-modal-confirm" onclick="doEdit(${catId}, ${cardId}, '${field}')">確定儲存</button></div>`;
        }
        document.getElementById('modalOverlay').style.display='flex';
    }

    function showAddCat() { document.getElementById('modalBox').innerHTML = `<h3>${ICONS.plus} 新增分類頻道</h3><span class="guide-text">💡 建立您的消費場景（如：外送、交通）</span><input type="text" id="catN" class="input-box" placeholder="名稱"><div class="modal-btns"><button class="btn-modal-cancel" onclick="closeModal()">取消</button><button class="btn-modal-confirm" onclick="const n=document.getElementById('catN').value; if(n){data.push({id:Date.now(),name:n,cards:[],isCollapsed:false});save();closeModal();}">建立</button></div>`; document.getElementById('modalOverlay').style.display='flex'; }
    function addTierUI(r="", l="") { const div = document.createElement('div'); div.style.display="flex"; div.style.gap="10px"; div.style.marginBottom="10px"; div.innerHTML = `<input type="number" class="input-box t-r" placeholder="%" style="flex:1" value="${r}"><input type="number" class="input-box t-l" placeholder="上限" style="flex:2" value="${l}"><button onclick="this.parentElement.remove()" style="border:none;background:none;color:var(--danger);font-size:1.5em;">✕</button>`; document.getElementById('tCon').appendChild(div); }
    function showAddCard(id) { document.getElementById('modalBox').innerHTML = `<h3>${ICONS.card} 加入新卡片</h3><span class="guide-text">💡 若名稱重複，將自動套用現有規則。</span><input type="text" id="cN" class="input-box" placeholder="名稱" oninput="autoFill(this.value)"><div id="tCon"></div><button onclick="addTierUI()" style="width:100%;padding:14px;margin-bottom:15px;border:2px dashed #e2e8f0;border-radius:20px;background:none;color:var(--primary);font-weight:800;font-size:0.85em;font-family:inherit;">＋增加回饋分層</button><input type="text" id="cNo" class="input-box" placeholder="備註"><div class="modal-btns"><button class="btn-modal-cancel" onclick="closeModal()">取消</button><button class="btn-modal-confirm" onclick="doAddCard(${id})">確認加入</button></div>`; addTierUI("5", "300"); document.getElementById('modalOverlay').style.display='flex'; }
    function doAddCard(catId) { const n = document.getElementById('cN').value.trim(), nt = document.getElementById('cNo').value.trim(), rs = document.querySelectorAll('.t-r'), ls = document.querySelectorAll('.t-l'); let ts = []; rs.forEach((r, i) => { if(r.value) ts.push({ rate: Number(r.value), limit: Number(ls[i].value) }); }); if(n && ts.length) { data.find(c=>c.id===catId).cards.push({ id: Date.now(), name: n, tiers: ts, spent: 0, note: nt, records: [] }); save(); closeModal(); } }
    function showRewardDetail(name) { let ts = 0, tiers = []; data.forEach(cat => cat.cards.forEach(card => { if(card.name.trim()===name.trim()){ ts += (card.spent||0); tiers = card.tiers; } })); let minCap = 9999999; tiers.forEach(t => { if(t.limit<999999){ const c = Math.round(t.limit/(t.rate/100)); if(c<minCap) minCap = c; } }); let html = `<h3>${ICONS.chart} 回饋試算</h3>`; tiers.forEach((t, i) => { const r = Math.floor(Math.min(ts * (t.rate/100), t.limit)); html += `<div style="padding:12px;background:#f8fafc;border-radius:18px;margin-bottom:10px;font-size:0.9em;font-weight:700;">分層 ${i+1} (${t.rate}%)：<b>$${r.toLocaleString()}</b> / ${t.limit>=999999?'無上限':'$'+t.limit.toLocaleString()}</div>`; }); html += `<div style="margin-top:20px;padding:18px;background:#fff5f5;border-radius:20px;color:var(--danger);font-weight:800;text-align:center">剩餘封頂：$${Math.max(0, minCap-ts).toLocaleString()}</div><button class="btn-modal-confirm" style="width:100%;margin-top:20px" onclick="closeModal()">了解</button>`; document.getElementById('modalBox').innerHTML = html; document.getElementById('modalOverlay').style.display='flex'; }
    function doEdit(catId, cardId, field) { const v = document.getElementById('editV').value; const target = data.find(c=>c.id===catId).cards.find(cd=>cd.id===cardId), name = target.name; if (field === 'name') { data.forEach(c => c.cards.forEach(cd => { if(cd.name.trim()===name.trim()) cd.name = v.trim(); })); } else { target[field] = v.trim(); } save(); closeModal(); }
    function doSyncTiers(catId, cardId) { const target = data.find(c=>c.id===catId).cards.find(cd=>cd.id===cardId); const rs = document.querySelectorAll('.t-r'), ls = document.querySelectorAll('.t-l'); let ts = []; rs.forEach((r, i) => { if(r.value) ts.push({ rate: Number(r.value), limit: Number(ls[i].value) }); }); data.forEach(c => c.cards.forEach(cd => { if(cd.name.trim()===target.name.trim()) cd.tiers = JSON.parse(JSON.stringify(ts)); })); save(); closeModal(); }
    function importData(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { try { let imp = JSON.parse(e.target.result); if(Array.isArray(imp)){ data = migrate(imp); save(); alert("匯入成功！"); } } catch(err) { alert("格式錯誤"); } }; reader.readAsText(file); }
    
    // 歸零時也必須清空明細陣列
    function resetAll() { 
        if(confirm("確定歸零本月所有消費明細與金額？")) { 
            data.forEach(c => c.cards.forEach(cd => { 
                cd.spent = 0; 
                cd.records = []; 
            })); 
            save(); 
        } 
    }
    
    function autoFill(n) { for(let cat of data) for(let c of cat.cards) if(c.name.trim()===n.trim()){ const tCon=document.getElementById('tCon'); tCon.innerHTML=''; c.tiers.forEach(t=>addTierUI(t.rate,t.limit)); return; } }

    load();
</script>
</body>
</html>
